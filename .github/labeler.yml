# Configuration for PR Labeler
# Automatically labels pull requests based on file paths

# Frontend changes
'frontend':
  - changed-files:
    - any-glob-to-any-file: 
      - 'app/**/*'
      - 'components/**/*'
      - 'styles/**/*'

# UI/UX changes
'ui/ux':
  - changed-files:
    - any-glob-to-any-file:
      - 'components/**/*'
      - 'styles/**/*'
      - 'public/**/*'

# Backend/API changes
'backend':
  - changed-files:
    - any-glob-to-any-file:
      - 'app/api/**/*'
      - 'lib/**/*'

# Data-related changes
'data':
  - changed-files:
    - any-glob-to-any-file:
      - 'data/**/*'
      - 'types/**/*'

# Documentation changes
'documentation':
  - changed-files:
    - any-glob-to-any-file:
      - '*.md'
      - 'docs/**/*'
      - '.github/**/*.md'

# Configuration changes
'config':
  - changed-files:
    - any-glob-to-any-file:
      - '*.json'
      - '*.yml'
      - '*.yaml'
      - '*.config.*'
      - '.github/workflows/**/*'
      - 'wrangler.jsonc'
      - 'tsconfig.json'

# Dependencies
'dependencies':
  - changed-files:
    - any-glob-to-any-file:
      - 'package.json'
      - 'package-lock.json'

# Scripts and automation
'scripts':
  - changed-files:
    - any-glob-to-any-file:
      - 'scripts/**/*'

# GitHub workflows and actions
'github-actions':
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**/*'
      - '.github/agents/**/*'

# Testing (add when test files exist)
'tests':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.test.*'
      - '**/*.spec.*'
      - '__tests__/**/*'

# Hooks
'hooks':
  - changed-files:
    - any-glob-to-any-file:
      - 'hooks/**/*'

# TypeScript types
'types':
  - changed-files:
    - any-glob-to-any-file:
      - 'types/**/*'
      - '**/*.d.ts'
