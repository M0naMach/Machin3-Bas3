name: "Deploy to Cloudflare"

on:
  push:
    branches: [ "live-deploy" ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: "Production Deploy"
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.cloudflare.outputs.url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          # Add any build-time env vars here
          NODE_ENV: production

      - name: Publish to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/pages-action@f0a1ade5871720516fc98b9264639999a071726a # v1.5.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "machin3-bas3" # Ensure this matches your project name in Cloudflare Dashboard
          directory: ".vercel/output/static" # Standard output for @cloudflare/next-on-pages
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
