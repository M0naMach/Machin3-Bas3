name: "Deploy to Cloudflare"

on:
  push:
    branches: [ "live-deploy" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: "Production Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build for Cloudflare Pages
        run: npm run pages:build
        env:
          # Add any build-time env vars here
          NODE_ENV: production
          NEXT_PUBLIC_PORTFOLIO_URL: "https://p0rtf0li0-spac3.m0nalisa.workers.dev"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=machin3-bas3

      - name: Deployment Success
        run: |
          echo "✅ Deployment successful!"
          echo "Check deployment status at: https://dash.cloudflare.com/"
